[project]
name = "trust-card"
version = "0.1.0"
description = "A privacy-first context-aware suspicious link checker"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50.0.2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pillow>=12.3.0",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.unittest]
start-directory = "tests"
